name: Mobile Release

# Native binaries + store submission via EAS Build (the compile runs on EAS
# servers; this workflow only orchestrates).
#   • tag `mobile-v*`   -> production build + store submit for BOTH apps
#   • manual dispatch   -> build any app/platform on preview or production,
#                          with optional --auto-submit
#
# Production uses appVersionSource=remote + autoIncrement, so EAS owns the iOS
# build number / Android versionCode. Bump the user-facing `version` in app.json
# (which also bumps runtimeVersion, cutting a fresh OTA lineage) for a new store
# version.
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      app:
        description: Which app(s) to build
        type: choice
        options: [both, rider, driver]
        default: both
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Auto-submit to the stores (production only; needs store creds on EAS)
        type: boolean
        default: false

# Never cancel an in-flight release; queue instead.
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      platform: ${{ steps.plan.outputs.platform }}
      profile: ${{ steps.plan.outputs.profile }}
      submit: ${{ steps.plan.outputs.submit }}
    steps:
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_APP: ${{ github.event.inputs.app }}
          IN_PLATFORM: ${{ github.event.inputs.platform }}
          IN_PROFILE: ${{ github.event.inputs.profile }}
          IN_SUBMIT: ${{ github.event.inputs.submit }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # Tag push = production release. iOS and store submit are deferred
            # until their credentials exist, so a tag builds Android only and does
            # not submit. Flip platform to "all" / submit to "true" (or use manual
            # dispatch) once the Apple + Play credentials are set up.
            echo 'apps=["rider","driver"]' >> "$GITHUB_OUTPUT"
            echo "platform=android" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "submit=false" >> "$GITHUB_OUTPUT"
          else
            case "$IN_APP" in
              both) echo 'apps=["rider","driver"]' >> "$GITHUB_OUTPUT" ;;
              *)    echo "apps=[\"$IN_APP\"]" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "platform=$IN_PLATFORM" >> "$GITHUB_OUTPUT"
            echo "profile=$IN_PROFILE" >> "$GITHUB_OUTPUT"
            echo "submit=$IN_SUBMIT" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    name: build ${{ matrix.app }} (${{ needs.plan.outputs.profile }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mobile-setup
      - uses: ./.github/actions/mobile-gate
        with:
          app: ${{ matrix.app }}
      - uses: expo/expo-github-action@v9
        with:
          eas-version: '21.5.0'
          token: ${{ secrets.EXPO_TOKEN }}
          # npm (not pnpm) for the eas-cli install: pnpm 11 aborts on eas-cli's
          # optional native dep dtrace-provider (ERR_PNPM_IGNORED_BUILDS); npm
          # treats it as optional and skips it.
          packager: npm
      # --no-wait: return once the build is queued (EAS emails / dashboard track
      # it, and --auto-submit chains the store submission server-side). The build
      # profile carries channel + environment + versioning, so no extra flags.
      - name: eas build
        working-directory: ${{ matrix.app }}
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          PLATFORM: ${{ needs.plan.outputs.platform }}
          SUBMIT: ${{ needs.plan.outputs.submit }}
        run: |
          submit_flag=""
          if [ "$SUBMIT" = "true" ]; then submit_flag="--auto-submit"; fi
          eas build \
            --profile "$PROFILE" \
            --platform "$PLATFORM" \
            $submit_flag \
            --non-interactive \
            --no-wait
