name: CI

# This workflow is the gate every Railway deploy waits on ("Wait for CI" is
# enabled per service). If it's red, nothing ships — keep it green.
on:
  push:
    # main → staging env; production → production env — both gated by this CI
    # run before Railway deploys (per-service "Wait for CI").
    branches: [main, production]
  pull_request:

# One active run per branch/PR; a new push cancels the stale run instead of
# piling up (and wasting the Postgres/Redis service containers).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    # Postgres + Redis mirror the backend's runtime deps. The credentials match
    # the env.schema defaults (kari/kari/kari on localhost:5432), so `test` and
    # the migration gate need no extra DB env beyond host/port below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kari
          POSTGRES_PASSWORD: kari
          POSTGRES_DB: kari
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U kari"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Turbo's --affected can diff a PR against its base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      # .nvmrc is the single source of truth for the Node version (22.13.1),
      # shared with the Dockerfiles and EAS so CI tests what prod runs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Persist Turbo's cache between runs so unchanged task inputs are cache
      # hits instead of re-running typecheck/lint/build/test from scratch.
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      # Formatting gate (non-mobile). rider/driver are excluded in .prettierignore
      # and gated by the mobile pipeline instead. Cheap, so it runs first.
      - run: pnpm format:check

      # PRs: only the workspaces affected vs the base branch — fast feedback that
      # mirrors Railway's per-service watchPatterns (change backend/ → only
      # backend runs; change packages/ → everything downstream runs).
      - name: Verify affected (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm exec turbo run typecheck lint build test --affected --cache-dir=.turbo
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

      # main/production: full run across every workspace. The gate the staging
      # (main) and production (production) deploys wait on — do not scope down.
      - name: Verify all (deploy branches)
        if: github.event_name != 'pull_request'
        run: pnpm exec turbo run typecheck lint build test --cache-dir=.turbo

      # Prove the TypeORM migration chain applies cleanly on a fresh database
      # before it ever runs on a Railway boot (the backend runs migrations on
      # start; a bad one there means a crash-loop). @kari/types is built first
      # so the entities the DataSource loads resolve.
      - name: Validate migrations on a fresh DB
        run: |
          pnpm --filter @kari/types build
          pnpm --filter @kari/backend migration:run
