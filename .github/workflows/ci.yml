name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kari
          POSTGRES_PASSWORD: kari
          POSTGRES_DB: kari
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U kari"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # .nvmrc is the single source of truth for the Node version (22.13.1),
      # shared with the Dockerfiles and EAS so CI tests what prod runs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck every workspace (backend, admin, web, both mobile apps, and the
      # shared packages). This is the only correctness gate the Expo apps have,
      # so it must run — a type error in rider/driver used to sail through CI.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          REDIS_URL: redis://localhost:6379
